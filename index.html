<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>波场链商城支付</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing: border-box;margin:0;padding:0;-webkit-tap-highlight-color: transparent;font-family: -apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
body{background:#1c223b;padding:32px 16px;min-height:100vh;}
.container{max-width:420px;margin:0 auto;}
.head-title{color:#fff;text-align:center;font-size:18px;margin-bottom:28px;}

.btn-yellow{
    width:100%;
    background:#ffaa2b;
    border:none;
    font-size:17px;
    font-weight:bold;
    color:#111;
    border-radius:10px;
    padding:14px 0;
    margin-bottom:14px;
}
.btn-yellow:disabled{background:#ffcc70;}

.amount-box{
    border:2px solid #ffaa2b;
    border-radius:10px;
    background:#242b48;
    padding:13px 16px;
    margin-bottom:20px;
}
#inputAmount{
    width:100%;
    background:transparent;
    border:0;
    outline:none;
    color:#ffffff;
    font-size:18px;
}

.qr-wrap{
    background:#ffffff;
    border-radius:12px;
    padding:20px;
    text-align:center;
    margin-bottom:22px;
}
#qrCanvas{
    display:inline-block;
}
.show-address{
    margin-top:8px;
    font-size:11px;
    color:#333;
    word-break:break-all;
}

.status{
    color:#dddddd;
    font-size:13px;
    text-align:center;
    margin-bottom:10px;
    word-break:break‑all;
}
.hint{
    font-size:12px;
    color:#ff9494;
    text-align:center;
}
</style>
</head>
<body>
<div class="container">
    <div class="head-title">波场链TRC20‑USDT商城支付</div>

    <button class="btn-yellow" id="connectWalletBtn">连接钱包(TRON)</button>

    <div class="amount-box">
        <input id="inputAmount" placeholder="请输入支付金额 USDT" step="0.000001" type="number">
    </div>

    <div class="qr-wrap">
        <div id="qrCanvas"></div>
        <div class="show-address">收款：TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
    </div>

    <button class="btn-yellow" id="paySubmitBtn" disabled>确认支付</button>

    <div class="status" id="statusText">尚未连接钱包</div>
    <div class="hint">⚠️直接转账模式，无授权，点击按钮唤起钱包签名交易</div>
</div>

<script>
// 配置
const RECEIVE_WALLET = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
let tronWeb = null;

const connectWalletBtn = document.querySelector("#connectWalletBtn");
const paySubmitBtn = document.querySelector("#paySubmitBtn");
const inputAmount = document.querySelector("#inputAmount");
const statusText = document.querySelector("#statusText");

//绘制收款二维码（仅展示地址）
QRCode.toCanvas(document.getElementById("qrCanvas"),RECEIVE_WALLET,{width:210},err=>{
    if(err) console.log(err);
})

//兼容iOS TP扫码，等待tronweb注入
async function waitBridgeReady(){
    for(let i=0;i<25;i++){
        if(window.tronWeb && window.tronWeb.ready){
            tronWeb = window.tronWeb;
            return true;
        }
        await new Promise(res=>setTimeout(res,120));
    }
    return false;
}

//连接钱包
connectWalletBtn.onclick = async ()=>{
    statusText.innerText = "正在连接钱包";
    const ready = await waitBridgeReady();
    if(!ready){
        statusText.innerText = "请在TP钱包「发现」页面打开本DApp";
        return;
    }
    try{
        await window.tronWeb.requestAccounts();
        tronWeb = window.tronWeb;
        const userAddr = tronWeb.defaultAddress.base58;
        statusText.innerText = "已连接："+userAddr;
        paySubmitBtn.disabled = false;
        connectWalletBtn.innerText = "钱包已连接";
    }catch(e){
        statusText.innerText = "连接失败："+e.message;
    }
}

//确认支付，transfer直接转账，不执行approve授权
paySubmitBtn.onclick = async ()=>{
    if(!tronWeb || !tronWeb.ready){
        statusText.innerText = "请先连接钱包";
        return;
    }
    const payNum = parseFloat(inputAmount.value);
    if(isNaN(payNum) || payNum <= 0){
        statusText.innerText = "请输入有效的支付金额";
        return;
    }
    statusText.innerText = "唤起钱包，请确认转账签名";
    try{
        const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        const sunValue = tronWeb.toSun(payNum);
        const txHash = await usdtContract.transfer(RECEIVE_WALLET,sunValue).send({feeLimit:100000000});
        statusText.innerText = "✅交易已提交，哈希："+txHash;
    }catch(error){
        statusText.innerText = "转账失败："+ (error.message || error);
    }
}

//页面预检测钱包环境
(async ()=>{ await waitBridgeReady(); })();
</script>
</body>
</html>
