<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>全球全类型Unicode隐形字符生成器</title>
<style>
body{font-family:Microsoft YaHei;padding:20px;font-size:16px;}
.box{margin:18px 0;}
input,select{width:480px;padding:7px;font-size:16px;}
textarea{width:480px;height:80px;}
button{padding:8px 18px;font-size:15px;cursor:pointer;margin-right:8px;}
.info{background:#e4ecec;padding:14px;width:474px;}
.check-row{margin:8px 0;}
.check-item{margin:4px 8px;display:inline-block;}
.title-line{font-weight:bold;margin-top:12px;margin-bottom:4px;}
</style>
</head>
<body>
<h2>Unicode 全类型隐形字符生成器（含检测功能）</h2>
<p>包含韩文、蒙古文、零宽、盲文、高棉文、格式占位符；生成后可查看Unicode编码，用来提前检测平台过滤。</p>
<div class="info">
    <div class="title-line">一、韩文区块（合约平台兼容性最好，优先使用）</div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="k1" checked><label for="k1">U+115F 韩文辅音填充符</label></div>
        <div class="check-item"><input type="checkbox" id="k2" checked><label for="k2">U+1160 韩文元音填充符(ᅠ)</label></div>
    </div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="k3" checked><label for="k3">U+3164 韩文空白符(ㅤ)</label></div>
        <div class="check-item"><input type="checkbox" id="k4" checked><label for="k4">U+FFA0 半角韩文填充符</label></div>
    </div>

    <div class="title-line">二、零宽字符（宽度为0，大量平台会过滤）</div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="z1"><label for="z1">U+200B 零宽空格</label></div>
        <div class="check-item"><input type="checkbox" id="z2"><label for="z2">U+200C 零宽非连接符</label></div>
        <div class="check-item"><input type="checkbox" id="z3"><label for="z3">U+200D 零宽连接符</label></div>
    </div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="z4"><label for="z4">U+2060 单词连接符</label></div>
        <div class="check-item"><input type="checkbox" id="z5"><label for="z5">U+FEFF 零宽不间断空格</label></div>
        <div class="check-item"><input type="checkbox" id="z6"><label for="z6">U+180E 蒙古文元音分隔符</label></div>
    </div>

    <div class="title-line">三、特殊空白占位字符（各类小众语种区块，极少被过滤）</div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="s1"><label for="s1">U+2800 盲文空白符</label></div>
        <div class="check-item"><input type="checkbox" id="s2"><label for="s2">U+1680 欧甘文字空格</label></div>
        <div class="check-item"><input type="checkbox" id="s3"><label for="s3">U+034F 组合字连接符</label></div>
    </div>
    <div class="check-row">
        <div class="check-item"><input type="checkbox" id="s4"><label for="s4">U+17B4 高棉文元音</label></div>
        <div class="check-item"><input type="checkbox" id="s5"><label for="s5">U+00AD 软连字符</label></div>
    </div>

    <div class="title-line">四、自定义Unicode字符（粘贴任意隐形字符扩充字符池）</div>
    <input type="text" id="customChar" placeholder="粘贴其它空白字符，多个直接连在一起">
</div>

<div class="box">
    <p>生成类型</p>
    <select id="type">
        <option>在输入文字的每个字母中间插入隐形字符</option>
        <option>所有隐形字符全部添加到文字开头</option>
        <option>所有隐形字符全部添加到文字末尾</option>
        <option>将隐形字符随机分散插入文字任意位置</option>
    </select>
</div>
<div class="box">
    <p>需要修改的文字</p>
    <input type="text" id="inputTxt" value="USDT">
</div>
<div class="box">
    <p>基础字符数量</p>
    <input type="number" id="count" value="1" min="1">
</div>
<div class="box">
    <button onclick="createAndCopy()">生成并复制</button>
    <button onclick="checkCode()">检测生成内容的Unicode编码（用来判断平台过滤）</button>
</div>
<div class="box">
    <p>检测输出</p>
    <textarea id="codeResult" readonly></textarea>
</div>

<script>
//全部内置字符映射
const charMap = {
    k1:"\u115F",k2:"\u1160",k3:"\u3164",k4:"\uFFA0",
    z1:"\u200B",z2:"\u200C",z3:"\u200D",z4:"\u2060",z5:"\uFEFF",z6:"\u180E",
    s1:"\u2800",s2:"\u1680",s3:"\u034F",s4:"\u17B4",s5:"\u00AD"
};
let lastGeneratedText = "";

//获取勾选+自定义的完整字符池
function getPool(){
    let pool = [];
    for(let key in charMap){
        if(document.getElementById(key).checked) pool.push(charMap[key]);
    }
    let custom = document.getElementById("customChar").value;
    for(let ch of custom) pool.push(ch);
    if(pool.length === 0){
        alert("至少勾选一项字符，或者填写自定义字符！");
        return null;
    }
    return pool;
}
function getOneChar(pool){
    return pool[Math.floor(Math.random()*pool.length)];
}
function getCharStr(num,pool){
    let s = "";
    for(let i=0;i<num;i++) s += getOneChar(pool);
    return s;
}

//生成逻辑
async function createAndCopy(){
    const pool = getPool();
    if(!pool) return;
    const text = document.getElementById("inputTxt").value;
    const num = Number(document.getElementById("count").value);
    const mode = document.getElementById("type").value;
    let res = "";
    const charStr = getCharStr(num,pool);

    switch(mode){
        case "在输入文字的每个字母中间插入隐形字符":
            for(let letter of text) res += letter + charStr; break;
        case "所有隐形字符全部添加到文字开头":
            res = charStr + text; break;
        case "所有隐形字符全部添加到文字末尾":
            res = text + charStr; break;
        case "将隐形字符随机分散插入文字任意位置":
            let arr = text.split("");
            let chars = charStr.split("");
            for(let c of chars){
                let pos = Math.floor(Math.random()*(arr.length+1));
                arr.splice(pos,0,c);
            }
            res = arr.join("");
            break;
    }
    lastGeneratedText = res;
    await navigator.clipboard.writeText(res);
    alert("复制完成，可以点检测按钮查看编码");
}

//编码检测，用来判断平台过滤
function checkCode(){
    if(!lastGeneratedText){
        alert("请先生成内容！");
        return;
    }
    let output = [];
    [...lastGeneratedText].forEach(c=>{
        let code = "U+"+c.charCodeAt(0).toString(16).toUpperCase();
        output.push(code+" ("+c+")");
    });
    document.getElementById("codeResult").value = output.join("\n");
}
</script>
</body>
</html>
