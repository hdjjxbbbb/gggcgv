<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双二维码 TP‑imToken</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0B0B1F;color:#fff;padding:24px}
.container{max-width:460px;margin:0 auto}
.box{background:#1E1E35;padding:24px;border-radius:18px;margin-bottom:20px;text-align:center}
h3{margin-bottom:10px;font-size:17px}
.desc{font-size:13px;color:#ccc;margin-bottom:16px;line-height:1.6}
.warn{font-size:13px;color:#ff7777;margin-bottom:12px;line-height:1.6}
.qr-img{width:240px;height:240px;border-radius:12px}
.bottom-text{text-align:center;color:#aaa;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="container">

<div class="box">
    <h3>✅ TokenPocket 钱包 扫此码</h3>
    <div class="desc">TP钱包任意位置扫码，包括转账页面内扫码，均可直接唤起转账</div>
    <div class="warn">⚠️ imToken不要扫这个码！</div>
    <img class="qr-img" id="qrTp">
</div>

<div class="box">
    <h3>✅ imToken / 其他钱包 扫此码</h3>
    <div class="desc">imToken、麦子等钱包请扫下面二维码</div>
    <div class="warn">⚠️ TP钱包不要扫这个码，会出现地址前缀错误！</div>
    <img class="qr-img" id="qrImtoken">
</div>

<div class="bottom-text">
收款地址：TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE（TRC20‑USDT）
</div>

</div>

<script>
const ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

// TP私有deeplink
const tpRaw = `tpoutside://pull.activity?param=${encodeURIComponent(JSON.stringify({
    protocol:"TokenPocket",
    version:"2.0",
    blockchain:"tron",
    action:"transfer",
    symbol:"USDT",
    contract:USDT_CONTRACT,
    to:ADDR
}))}`;

// imToken标准tron URI，tokenID=31713为波场USDT
const imRaw = `tron:${ADDR}?tokenID=31713`;

const base = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=";
document.getElementById("qrTp").src = base + encodeURIComponent(tpRaw);
document.getElementById("qrImtoken").src = base + encodeURIComponent(imRaw);
</script>
</body>
</html>
