<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付开通</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0F1025;
            color: #fff;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .main-card {
            background-color: #1A1C3B;
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 440px;
            margin: 0 auto;
        }
        .header-box {
            text-align: center;
            margin-bottom: 32px;
        }
        .header-box h1 {
            font-size: 36px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header-box .sub-text {
            color: #B8B9D1;
            font-size: 20px;
            margin-top: 10px;
        }
        .connected-btn {
            width: 100%;
            background-color: #FFC107;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 16px 0;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .amount-box {
            width: 100%;
            background-color: #000000;
            border-radius: 16px;
            padding: 18px 0;
            text-align: center;
            font-size: 24px;
            color: #fff;
            margin-bottom: 24px;
        }
        .qr-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        #qr-canvas {
            width: 280px;
            height: 280px;
        }
        .confirm-pay-btn {
            width: 100%;
            background-color: #FFC107;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px 0;
            font-size: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="header-box">
            <h1>
                <span>💳</span>
                支付开通
            </h1>
            <div class="sub-text">波场链支付 · 安全开通</div>
        </div>

        <button class="connected-btn">✅ 已连接</button>

        <div class="amount-box">自定义转账</div>

        <div class="qr-container">
            <canvas id="qr-canvas"></canvas>
        </div>

        <button class="confirm-pay-btn">确认支付</button>
    </div>

    <script>
        // 固定收款地址
        const RECEIVE_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
        // TronLink 标准唤起转账协议：打开钱包原生转账页面，收款地址预填，金额由用户手动输入（和截图效果一致）
        // TRC20 USDT 合约地址：TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        const tronDeepLink = `tronlink://transfer?token=TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t&to=${RECEIVE_ADDR}`;

        const canvas = document.getElementById("qr-canvas");
        QRCode.toCanvas(canvas, tronDeepLink, { width: 280 }, function (err) {
            if (err) console.error(err);
        });
    </script>
</body>
</html>
